<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multîles — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2440; --ink-2:#4D5675; --lagon:#E6F4F2; --lagon-2:#CFE3DF; --white:#FFFFFF;
  --ballon:#2F5BEA; --ballon-clair:#E3EAFD;
  --feuille:#157F45; --miel:#FFE7A0; --laiton:#94660F;
  --titre:"Fredoka","Baloo 2","Nunito",system-ui,sans-serif;
  --ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ile:#BF3A1A; --ile-clair:#FADCD3; --ile-sombre:#952D14;
  --profil:#C8371D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:#D7E9E5;color:var(--ink);font-family:var(--ui);font-weight:700;font-size:17px;line-height:1.4}
button{font-family:var(--ui);font-weight:800;color:var(--ink);cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--ballon);outline-offset:3px}
h1,h2{margin:0}
p{margin:0}

/* ===== Revue ===== */
.stage{min-height:100%;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:32px 24px}
.review{width:300px;flex:none;display:grid;gap:20px;padding-top:12px}
.review h1{font-family:var(--titre);font-weight:600;font-size:26px;line-height:1.1}
.review .sub{color:var(--ink-2);font-size:15px;margin-top:4px}
.rgroup p{margin:0 0 8px;font-size:14px;color:var(--ink-2)}
.rchips{display:flex;flex-wrap:wrap;gap:8px}
.rchip{border:2px solid var(--ink);border-radius:12px;padding:6px 12px;font-size:14px;background:#fff;min-height:40px}
.rchip[aria-pressed="true"]{background:var(--ink);color:#fff}
.rnote{font-size:14px;color:var(--ink-2)}

/* ===== Téléphone ===== */
.phone{width:390px;height:844px;flex:none;border:4px solid var(--ink);border-radius:52px;overflow:hidden;position:relative;background:var(--lagon);box-shadow:10px 10px 0 var(--ink)}
@media (max-width:760px){
  .stage{padding:0;flex-direction:column;gap:0}
  .phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .review{width:100%;padding:24px 20px 40px}
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--lagon)}

/* ===== Boutons communs ===== */
.btn-primary{height:64px;width:100%;flex:none;border-radius:22px;background:var(--ballon);color:#fff;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:22px;transition:transform .06s,box-shadow .06s}
.btn-primary:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn-primary[aria-disabled="true"]{background:var(--lagon-2);color:var(--ink-2)}
.btn-primary[aria-disabled="true"]:active{transform:none;box-shadow:0 6px 0 var(--ink)}
.btn-chip{height:56px;padding:0 14px 0 10px;border-radius:18px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:inline-flex;align-items:center;gap:6px;font-size:15px;flex:none}
.btn-chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn-say{flex:none;width:56px;height:56px;border-radius:16px;border:3px solid var(--ink);background:var(--lagon);display:grid;place-items:center;align-content:center;font-size:11px;line-height:1;padding-top:2px}
.btn-say:active{transform:translateY(2px)}
.btn-say.speaking{background:var(--miel)}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;flex:none}
.topbar .ttl{flex:1;text-align:center;font-family:var(--titre);font-weight:600;font-size:22px;white-space:nowrap}
.spacer56{width:104px;flex:none}
.topbar.tri{display:grid;grid-template-columns:112px 1fr 112px}

/* Bulle + mascotte */
.buddy{display:grid;grid-template-columns:84px 1fr;gap:6px;align-items:center;min-height:92px}
.buddy .m{width:84px;height:88px;display:grid;place-items:end center}
.m.idle svg{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.m.jump svg{animation:jump .6s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes jump{0%{transform:none}35%{transform:translateY(-16px) scale(1.06,.96)}70%{transform:scale(1.04,.96)}100%{transform:none}}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:8px;min-height:68px}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-9px;border:9px solid transparent;border-right:12px solid var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:9px solid #fff;border-left:0}
.bubble .t{flex:1;font-size:18px;line-height:1.25}

/* ===== Écran 1 : Qui joue ? ===== */
.who-head{padding:calc(30px + env(safe-area-inset-top,0px)) 16px 18px;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px}
.who-head h1{font-family:var(--titre);font-weight:700;font-size:40px;white-space:nowrap;text-align:center;line-height:1}
.who-logo{display:flex;justify-content:center;align-items:center;gap:8px;font-family:var(--titre);font-weight:600;font-size:18px;color:var(--ink-2);padding-top:calc(18px + env(safe-area-inset-top,0px))}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 16px}
.pcard{position:relative;border:3px solid var(--ink);border-radius:30px;box-shadow:0 6px 0 var(--ink);background:var(--c);padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:212px;transition:transform .06s,box-shadow .06s}
.pcard:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.pcard .disc{width:124px;height:124px;border-radius:50%;background:#fff;border:3px solid var(--ink);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.pcard .pep{position:absolute;right:6px;top:92px}
.pcard .nm{font-family:var(--titre);font-weight:600;font-size:27px;color:#fff;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard.add{background:transparent;border-style:dashed;box-shadow:none;justify-content:center;gap:12px}
.pcard.add:active{transform:none}
.pcard.add .plus{width:72px;height:72px;border-radius:50%;background:var(--ballon);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--ink)}
.pcard.add .nm{color:var(--ink);font-size:21px;white-space:normal;text-align:center}
.pcard.fresh{animation:fresh .9s ease-out}
@keyframes fresh{0%{transform:scale(.6)}50%{transform:scale(1.08)}75%{transform:scale(.97)}100%{transform:none}}
.who-foot{margin-top:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.toast{position:absolute;left:16px;right:16px;bottom:172px;background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;font-size:16px;text-align:center;z-index:40}

/* ===== Écran 2 : Création ===== */
.stepper{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st{display:grid;gap:4px;font-size:15px;text-align:center;color:var(--ink-2)}
.st i{display:block;height:12px;border-radius:6px;border:2px solid var(--ink);background:#fff}
.st.done i{background:var(--ballon)}
.st.now i{background:var(--miel)}
.st.now,.st.done{color:var(--ink)}
.pane{flex:1;display:flex;flex-direction:column;padding:6px 16px calc(20px + env(safe-area-inset-bottom,0px));gap:16px;min-height:0}
.name-input{width:100%;height:80px;border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);background:#fff;font-family:var(--titre);font-weight:600;font-size:36px;text-align:center;color:var(--ink);padding:0 16px}
.name-input::placeholder{color:#8A90A8}
.name-help{text-align:center;font-size:15px;color:var(--ink-2);margin-top:-4px}
.pep-list{display:grid;gap:14px}
.pep-card{display:grid;grid-template-columns:116px 1fr auto;align-items:center;gap:6px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);padding:6px 14px 6px 8px;min-height:132px;transition:transform .06s,box-shadow .06s}
.pep-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.pep-card b{display:block;font-family:var(--titre);font-weight:600;font-size:27px;line-height:1.1}
.pep-card .tr{display:block;font-size:16px;color:var(--ink-2)}
.pep-card .chk{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center}
.pep-card[aria-pressed="true"]{background:var(--ballon-clair);box-shadow:0 0 0 4px var(--ballon),0 6px 0 4px var(--ink)}
.pep-card[aria-pressed="true"] .chk{background:var(--ballon)}
.pane-title{font-family:var(--titre);font-weight:600;font-size:30px;line-height:1.1}

/* ===== Écran 3 : Éditeur d'avatar ===== */
.ed{flex:1;display:flex;flex-direction:column;min-height:0;gap:12px}
.ed-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;flex:none}
.ed-mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.ed-ring{width:156px;height:156px;border-radius:50%;background:#fff;border:6px solid var(--profil);box-shadow:0 0 0 3px var(--ink);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.ed-name{font-family:var(--titre);font-weight:600;font-size:24px;line-height:1.1}
.ed-dice{justify-self:end;align-self:center;width:84px;height:80px;border-radius:20px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;line-height:1.1;text-align:center}
.ed-dice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ed-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.tab{height:56px;padding:0 8px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-size:16px;flex:none}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.ed-grid{flex:1;overflow-y:auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start;padding:2px 2px 8px}
.tile{position:relative;height:118px;border-radius:22px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:4px 4px 6px;font-size:15px;overflow:hidden}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tile svg{flex:none}
.tile[aria-pressed="true"]{background:var(--ballon-clair);box-shadow:0 0 0 4px var(--ballon),0 4px 0 4px var(--ink)}
.tile .sw{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);margin-bottom:6px}
.tile.locked{background:var(--lagon);border-style:dashed}
.tile .price{position:absolute;top:5px;right:5px;display:flex;align-items:center;gap:4px;background:var(--laiton);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 8px 1px 3px;font-size:14px;font-weight:900;white-space:nowrap}


/* ===== Écran 4 : Accueil ===== */
.home-band{background:var(--profil);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;border-bottom:3px solid var(--ink);border-radius:0 0 34px 34px;flex:none;position:relative}
.home-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip-switch{height:56px;display:flex;align-items:center;gap:8px;padding:0 14px 0 6px;border-radius:18px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:15px}
.chip-switch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip-switch .mini{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--lagon);border:2px solid var(--ink);display:flex;align-items:flex-end;justify-content:center}
.home-hello{margin-top:14px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:10px 14px;font-size:17px;line-height:1.25;position:relative;margin-right:60px;min-height:68px;display:flex;align-items:center}
.home-hello::before{content:"";position:absolute;right:-14px;bottom:14px;border:10px solid transparent;border-left:14px solid var(--ink);border-right:0}
.home-hello::after{content:"";position:absolute;right:-8px;bottom:17px;border:7px solid transparent;border-left:10px solid #fff;border-right:0}
.home-scene{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-top:6px;position:relative;height:150px}
.home-ground{position:absolute;left:30px;right:30px;bottom:0;height:34px;border-radius:50%;background:var(--profil-sol)}
.home-disc{position:relative;width:132px;height:132px;border-radius:50%;background:#fff;border:3px solid var(--ink);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;margin-bottom:12px}
.home-pep{position:relative;cursor:pointer;margin-bottom:4px}
.home-stats{display:flex;gap:8px;margin-top:12px;align-items:center}
.stat{height:48px;display:flex;align-items:center;gap:6px;padding:0 12px 0 6px;border-radius:16px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:17px;font-weight:900}
.stat.coin{background:var(--laiton);color:#fff}
.stat.lvl{flex:1;padding:0 10px;gap:8px;font-size:15px}
.stat.lvl .bar{flex:1;height:12px;border-radius:6px;border:2px solid var(--ink);background:var(--lagon);overflow:hidden}
.stat.lvl .bar i{display:block;height:100%;background:var(--feuille)}
.home-body{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 16px 12px;min-height:0}
.isles-strip{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 var(--ink);padding:10px 14px;text-align:left;width:100%}
.isles-strip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.isles-strip b{font-family:var(--titre);font-weight:600;font-size:20px;display:block;line-height:1.1}
.isles-strip small{font-size:15px;color:var(--ink-2)}
.dots10{display:flex;gap:4px;margin-left:auto}
.dots10 i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--lagon)}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hcard{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 var(--ink);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:142px}
.hcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hcard .h{display:flex;align-items:center;gap:8px}
.hcard b{font-family:var(--titre);font-weight:600;font-size:20px;line-height:1.1}
.hcard small{font-size:15px;color:var(--ink-2);line-height:1.25}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:auto}
.wd{display:grid;justify-items:center;gap:2px;font-size:13px;color:var(--ink-2)}
.wd i{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:var(--lagon);display:grid;place-items:center}
.wd.on i{background:var(--profil)}
.wd.today i{background:var(--miel);box-shadow:0 0 0 2px var(--miel)}
.joker{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--ink)}
.hcard.done{background:var(--lagon)}
.btn-play{height:80px;width:100%;flex:none;border-radius:24px;background:var(--ballon);color:#fff;border:3px solid var(--ink);box-shadow:0 7px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;margin-top:auto;transition:transform .06s,box-shadow .06s}
.btn-play:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.btn-play b{font-family:var(--titre);font-weight:700;font-size:32px}
.btn-play small{font-size:15px;font-weight:800}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:3px solid var(--ink);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbtn{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;border-radius:16px;color:var(--ink-2)}
.tabbtn[aria-current="page"]{color:var(--ink);background:var(--lagon)}
.tabbtn[aria-current="page"] svg .f{fill:var(--ballon)}


/* ===== Écran 5 : Carte des îles ===== */
.map-head{background:#fff;border-bottom:3px solid var(--ink);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;display:grid;grid-template-columns:112px 1fr 112px;align-items:center;gap:8px;flex:none;position:relative;z-index:5}
.map-head .ttl{text-align:center;font-family:var(--titre);font-weight:600;font-size:24px}
.map-head .cnt{justify-self:end;display:flex;align-items:center;gap:4px;height:48px;padding:0 10px 0 6px;border:3px solid var(--ink);border-radius:16px;font-size:17px;font-weight:900}
.sea{flex:1;overflow-y:auto;position:relative;background:#A6DCE5;scroll-behavior:smooth}
.sea-in{position:relative;width:100%;height:2220px}
.sea-in > svg.trail{position:absolute;inset:0;width:100%;height:100%}
.isle{position:absolute;width:180px;margin-left:-90px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .08s}
.isle:active{transform:scale(.96)}
.isle svg.art{display:block}
.plate{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 4px;box-shadow:0 3px 0 var(--ink);font-family:var(--titre);font-weight:600;font-size:18px;white-space:nowrap;margin-top:-14px;position:relative}
.plate .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid var(--ink);font-size:18px}
.pips{display:flex;gap:4px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 8px}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--lagon)}
.pip.on{background:var(--feuille)}
.isle.locked .plate{color:var(--ink-2)}
.lockline{display:flex;align-items:center;gap:4px;font-size:15px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 10px 2px 4px}
.here{position:absolute;left:calc(50% + 44px);top:12px;z-index:2;display:flex;flex-direction:column;align-items:center;animation:bob 1.8s ease-in-out infinite;pointer-events:none}
.here .pin{width:54px;height:54px;border-radius:50%;background:#fff;border:4px solid var(--profil);box-shadow:0 0 0 3px var(--ink);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.here .tip{width:0;height:0;border:9px solid transparent;border-top:12px solid var(--ink);border-bottom:0;margin-top:2px}
.map-foot{flex:none;background:#fff;border-top:3px solid var(--ink);padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.btn-play.slim{height:72px}
.btn-play.slim b{font-size:26px}
.wave{position:absolute;pointer-events:none}


/* ===== Écran 6 : Détail d'une île ===== */
.isd-band{background:var(--ile);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;border-bottom:3px solid var(--ink);border-radius:0 0 34px 34px;flex:none;position:relative}
.isd-top{display:grid;grid-template-columns:112px 1fr 112px;align-items:center;gap:8px}
.isd-top .cnt{justify-self:end;display:flex;align-items:center;gap:4px;height:48px;padding:0 10px 0 6px;border:3px solid var(--ink);border-radius:16px;font-size:17px;font-weight:900;background:#fff;color:var(--ink)}
.isd-hero{display:flex;flex-direction:column;align-items:center;margin-top:2px}
.isd-hero svg.art{width:210px;height:152px}
.isd-hero h1{font-family:var(--titre);font-weight:700;font-size:32px;line-height:1;margin-top:-6px}
.isd-hero p{font-size:17px;margin-top:4px}
.isd-prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.isd-prog .bar{flex:1;height:16px;border-radius:8px;border:3px solid var(--ink);background:var(--ile-sombre);overflow:hidden}
.isd-prog .bar i{display:block;height:100%;background:#fff}
.isd-body{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));min-height:0;background:var(--ile-clair)}
.discover{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:8px 14px 8px 8px;text-align:left;min-height:62px}
.discover:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.discover b{font-family:var(--titre);font-weight:600;font-size:19px;display:block;line-height:1.1}
.discover small{font-size:15px;color:var(--ink-2)}
.discover .ic{width:44px;height:44px;border-radius:14px;background:var(--miel);border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stp{position:relative;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 var(--ink);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:124px;transition:transform .06s}
.stp:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.stp .n{width:38px;height:38px;border-radius:50%;background:var(--ile);color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--titre);font-weight:700;font-size:20px}
.stp .rg{font-family:var(--titre);font-weight:600;font-size:18px;line-height:1.1}
.stp .st3{display:flex;gap:1px;margin-top:auto}
.stp.lock{background:var(--lagon);border-style:dashed;box-shadow:none;color:var(--ink-2)}
.stp.lock .n{background:#fff;color:var(--ink-2)}
.stp[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ile),0 4px 0 4px var(--ink)}
.stp .now{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--miel);border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:13px;font-weight:900;white-space:nowrap}
.boss{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:8px;text-align:left;background:var(--ile);color:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:8px 14px 8px 6px;min-height:118px}
.boss:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.boss b{font-family:var(--titre);font-weight:600;font-size:22px;display:block;line-height:1.1}
.boss small{font-size:15px;display:block;margin-top:2px}
.boss.lock{background:var(--lagon);color:var(--ink);border-style:dashed;box-shadow:none}
.boss.lock small{color:var(--ink-2)}
.boss[aria-pressed="true"]{box-shadow:0 0 0 4px var(--miel),0 5px 0 4px var(--ink)}
.btn-isle{height:72px;width:100%;flex:none;margin-top:auto;border-radius:24px;background:var(--ile);color:#fff;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-family:var(--titre);font-weight:700;font-size:26px}
.btn-isle:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}


/* ===== Écran 8 : Feedback ===== */
.fb-sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;border-top:3px solid var(--ink);border-radius:32px 32px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:sheetUp .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.fb-sheet.ok{background:var(--feuille);color:#fff;min-height:270px}
.fb-sheet.help{background:var(--miel);color:var(--ink)}
.fb-row{display:flex;align-items:center;gap:10px}
.fb-row .m{width:86px;height:90px;flex:none;display:grid;place-items:end center}
.fb-title{font-family:var(--titre);font-weight:700;font-size:32px;line-height:1.05}
.fb-sub{font-size:17px;margin-top:2px}
.fb-eq{font-family:var(--titre);font-weight:700;font-size:44px;line-height:1;text-align:center;letter-spacing:-.5px}
.fb-sheet.ok .fb-eq{background:#fff;color:var(--feuille);border:3px solid var(--ink);border-radius:22px;padding:12px 0}
.combo{align-self:center;background:var(--miel);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:4px 16px;font-family:var(--titre);font-weight:600;font-size:20px}
.fb-auto{height:8px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden;margin-top:auto}
.fb-auto i{display:block;height:100%;background:#fff;transform-origin:left;animation:autoBar 1.5s linear forwards}
@keyframes autoBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fb-skip{font-size:15px;text-align:center}
.aid{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:10px 12px;display:grid;gap:8px}
.aid-top{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--ink-2)}
.aid-grid{display:grid;justify-content:center;gap:var(--g,3px)}
.aid-grid i{width:var(--d,14px);height:var(--d,14px);border-radius:50%;background:var(--ile);border:1.5px solid var(--ink)}
.aid-grid i.alt{background:var(--ile-clair)}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:17px;line-height:1.3}
.tip .bulb{flex:none;width:34px;height:34px;border-radius:12px;background:var(--miel);border:2px solid var(--ink);display:grid;place-items:center}
.btn-got{height:64px;border-radius:22px;background:var(--ile);color:#fff;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:22px;width:100%;flex:none}
.btn-got:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.fb-help-row{display:flex;gap:10px;align-items:center}
.conf{position:absolute;width:15px;height:15px;border:2px solid var(--ink);pointer-events:none;z-index:21}


/* ===== Écran 9 : Fin de session ===== */
.end-band{background:var(--ile);color:#fff;padding:calc(26px + env(safe-area-inset-top,0px)) 16px 0;border-bottom:3px solid var(--ink);border-radius:0 0 36px 36px;flex:none;text-align:center;position:relative}
.end-band h1{font-family:var(--titre);font-weight:700;font-size:34px;line-height:1.05}
.end-band .sub{font-size:17px;margin-top:4px}
.stars3{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-top:10px;height:84px}
.stars3 .s{opacity:0;animation:starIn .45s cubic-bezier(.3,1.6,.5,1) forwards}
.stars3 .s:nth-child(2){margin-bottom:16px}
@keyframes starIn{0%{opacity:0;transform:scale(.2) rotate(-40deg)}100%{opacity:1;transform:none}}
.end-hero{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-top:6px;margin-bottom:-26px;position:relative;z-index:2}
.end-hero .disc{width:96px;height:96px;border-radius:50%;background:#fff;border:3px solid var(--ink);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;margin-bottom:8px}
.end-body{flex:1;display:flex;flex-direction:column;gap:12px;padding:38px 16px calc(16px + env(safe-area-inset-bottom,0px));min-height:0;background:var(--ile-clair)}
.end-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.es{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:86px;justify-content:center}
.es b{font-family:var(--titre);font-weight:700;font-size:26px;line-height:1;display:flex;align-items:center;gap:4px}
.es small{font-size:14px;line-height:1.15;color:var(--ink-2)}
.es.coin{background:var(--laiton);color:#fff}
.es.coin small{color:#fff}
.end-grid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:12px;text-align:left;width:100%}
.end-grid:active{transform:translateY(2px)}
.mini10{display:grid;grid-template-columns:repeat(10,12px);gap:2px}
.mini10 i{width:12px;height:12px;border-radius:3px;background:var(--lagon);border:1px solid #B9C6CF}
.mini10 i.m{border-color:var(--ink)}
.mini10 i.new{background:var(--miel)!important;border:2px solid var(--ink);animation:cellIn .5s ease-out both}
@keyframes cellIn{0%{transform:scale(.2)}60%{transform:scale(1.5)}100%{transform:none}}
.end-grid b{font-family:var(--titre);font-weight:600;font-size:22px;display:block;line-height:1.1}
.end-grid small{font-size:15px;color:var(--ink-2);display:block;margin-top:2px}
.xp{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px}
.xp .bar{flex:1;height:14px;border-radius:7px;border:2px solid var(--ink);background:var(--lagon);overflow:hidden}
.xp .bar i{display:block;height:100%;background:var(--feuille);transition:width 1s ease-out .9s}
.end-actions{margin-top:auto;display:grid;gap:10px}
.btn-again{height:56px;border-radius:18px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-again:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.overlay{position:absolute;inset:0;z-index:60;background:rgba(30,36,64,.62);display:grid;place-items:center;padding:24px}
.ov-card{background:#fff;border:3px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:22px 20px 20px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:ovIn .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes ovIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.ov-card h2{font-family:var(--titre);font-weight:700;font-size:30px;line-height:1.05}
.ov-card p{font-size:17px;color:var(--ink-2)}
.sticker{width:170px;height:170px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 0 0 8px #fff,0 0 0 11px var(--ink);display:grid;place-items:center;overflow:hidden;transform:rotate(-6deg)}


/* ===== Écran 10 : Grille de Pythagore ===== */
.grid-scroll{flex:1;overflow-y:auto;min-height:0;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.grid-scroll > *{flex:none}
.g-head{display:flex;align-items:flex-end;gap:12px;padding-top:4px}
.g-big{font-family:var(--titre);font-weight:700;font-size:46px;line-height:.9}
.g-big small{font-family:var(--ui);font-weight:800;font-size:17px;color:var(--ink-2)}
.g-bar{height:18px;border-radius:9px;border:3px solid var(--ink);background:#fff;overflow:hidden;display:flex}
.g-bar i{height:100%;display:block;flex:none}
.pyth-card{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:8px}
.pyth{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:2px}
.pyth .h{min-width:0;display:grid;place-items:center;font-family:var(--titre);font-weight:700;font-size:15px;aspect-ratio:1}
.pyth .h.r{border-radius:50%;color:#fff;border:2px solid var(--ink)}
.pyth .h.r.full{box-shadow:0 0 0 2px #FFC93C}
.pyth .h.x{color:var(--ink-2);font-size:18px}
.pyth .c{min-width:0;overflow:hidden;letter-spacing:-.5px;aspect-ratio:1;border-radius:7px;border:1.5px solid #C9D6DC;background:#fff;display:grid;place-items:center;font-family:var(--titre);font-weight:600;font-size:13px;color:transparent;padding:0}
.pyth .c.m{border:2px solid var(--ink);color:#fff}
.pyth .c.t{background:var(--miel);border:2px dashed var(--ink);color:var(--ink)}
.pyth .c.sel{outline:3px solid var(--ink);outline-offset:1px;transform:scale(1.15);position:relative;z-index:2}
.pyth .c.hl{background:var(--lagon)}
.pyth .c.m.hl,.pyth .c.t.hl{filter:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);padding:8px 4px 2px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);display:inline-block}
.g-tip{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px 12px 8px 6px;font-size:16px;line-height:1.3}
.traps{background:var(--miel);border:3px solid var(--ink);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:10px}
.traps h2{font-family:var(--titre);font-weight:600;font-size:22px;line-height:1.1}
.traps .sub{font-size:15px;color:var(--ink);margin-top:2px}
.trap-chips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{height:48px;padding:0 14px;border-radius:16px;background:#fff;border:3px solid var(--ink);font-family:var(--titre);font-weight:700;font-size:21px}
.cell-sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:3px solid var(--ink);border-radius:32px 32px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:sheetUp .22s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 -6px 0 rgba(30,36,64,.08)}
.cs-top{display:flex;align-items:center;gap:10px}
.cs-badge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:900}


/* ===== Écran 11 : Boutique ===== */
.coinpill{justify-self:end;display:flex;align-items:center;gap:5px;height:48px;padding:0 12px 0 6px;border:3px solid var(--ink);border-radius:16px;font-size:18px;font-weight:900;background:var(--laiton);color:#fff}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:4px;margin:0 16px;flex:none}
.seg2 button{height:46px;border-radius:13px;font-size:17px}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:#fff}
.shop-stage{margin:12px 16px 0;height:196px;flex:none;background:#fff;border:3px solid var(--ink);border-radius:26px;display:flex;align-items:flex-end;justify-content:center;gap:14px;overflow:hidden;position:relative}
.shop-stage .ground{position:absolute;left:20px;right:20px;bottom:10px;height:30px;border-radius:50%;background:var(--lagon)}
.shop-stage .disc{position:relative;width:132px;height:132px;border-radius:50%;background:var(--lagon);border:3px solid var(--ink);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;margin-bottom:28px}
.shop-stage .pp{position:relative;margin-bottom:16px}
.shop-stage .tag{position:absolute;top:10px;left:10px;background:var(--miel);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:900}
.shop-stage.house{display:block;padding:0}
.shop-stage.house > svg{display:block;width:100%;height:100%}
.cat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px 0;flex:none}
.cat3 button{height:56px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.cat3 button[aria-selected="true"]{background:var(--ballon);color:#fff}
.shop-grid{flex:1;overflow-y:auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start;padding:12px 16px 8px}
.item{position:relative;height:152px;border-radius:22px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding:6px 4px 8px;font-size:14px;line-height:1.15;text-align:center}
.item:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.item .art{flex:1;display:grid;place-items:center;min-height:0}
.item .art svg{display:block}
.item[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ballon),0 4px 0 4px var(--ink)}
.item .pr{display:inline-flex;align-items:center;gap:3px;background:var(--laiton);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 8px 0 3px;font-size:14px;font-weight:900}
.item .own{display:inline-flex;align-items:center;background:var(--feuille);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:13px;font-weight:900}
.item .worn{background:var(--ink)}
.shop-foot{flex:none;padding:8px 16px 10px}
.shop-foot .hint{text-align:center;font-size:14px;color:var(--ink-2);margin-top:6px;min-height:19px}


/* ===== Écran 12 : Album et trophées ===== */
.alb-scroll{flex:1;overflow-y:auto;min-height:0;padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px}
.alb-scroll > *{flex:none}
.alb-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.alb-h h2{font-family:var(--titre);font-weight:600;font-size:24px;line-height:1.1}
.alb-h span{font-size:15px;color:var(--ink-2)}
.shelf{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:10px 10px 4px}
.shelf-row{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;border-bottom:8px solid #C8A26A;box-shadow:0 3px 0 var(--ink);margin-bottom:12px;padding:0 2px}
.troph{display:flex;flex-direction:column;align-items:center;gap:0;padding-top:4px;min-height:74px}
.troph .pl{margin-top:-2px;font-family:var(--titre);font-weight:700;font-size:14px;color:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 6px;line-height:1.3}
.troph.off svg{opacity:.28;filter:grayscale(1)}
.troph.off .pl{background:#9AA2B6!important}
.alb-bar{height:16px;border-radius:8px;border:3px solid var(--ink);background:#fff;overflow:hidden}
.alb-bar i{display:block;height:100%;background:var(--ballon)}
.page{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:10px 12px 12px;display:grid;gap:8px}
.page-h{display:flex;align-items:center;gap:8px;font-family:var(--titre);font-weight:600;font-size:19px}
.page-h .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid var(--ink);font-size:16px}
.page-h small{margin-left:auto;font-family:var(--ui);font-weight:800;font-size:14px;color:var(--ink-2)}
.stk3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;justify-items:center}
.stk{width:94px;height:94px;border-radius:50%;position:relative;display:grid;place-items:center;padding:0}
.stk.on{background:#fff;border:3px solid var(--ink);box-shadow:0 0 0 5px #fff,0 0 0 8px var(--ink);overflow:visible}
.stk.on .in{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.stk.off{border:3px dashed #9AA2B6;background:var(--lagon);font-family:var(--titre);font-weight:700;font-size:30px;color:#8A90A8}
.stk .new{position:absolute;top:-10px;right:-10px;background:var(--miel);border:2px solid var(--ink);border-radius:999px;padding:0 7px;font-size:12px;font-weight:900;color:var(--ink);z-index:2}


/* ===== Écran 13 : Espace parent ===== */
.par-head{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:12px;flex:none}
.par-head h1{font-family:var(--titre);font-weight:600;font-size:24px;flex:1}
.par-head .btn-chip{box-shadow:0 4px 0 #000}
.gate{flex:1;display:flex;flex-direction:column;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));gap:14px}
.gate .q{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:16px;font-size:18px;line-height:1.35}
.gate .q b{display:block;font-family:var(--titre);font-weight:600;font-size:24px;margin-top:6px;line-height:1.2}
.gate .ans{height:72px;border:3px solid var(--ink);border-radius:20px;background:#fff;display:grid;place-items:center;font-family:var(--titre);font-weight:700;font-size:40px}
.gate .msg{min-height:22px;text-align:center;font-size:15px;color:var(--ink-2)}
.gate .pad{margin-top:auto}
.gate .key.go{background:var(--ink)}
.par-body{flex:1;overflow-y:auto;min-height:0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.par-body > *{flex:none}
.kids{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.kid{height:56px;display:flex;align-items:center;gap:8px;padding:0 14px 0 6px;border-radius:18px;border:3px solid var(--ink);background:#fff;font-size:16px;flex:none}
.kid .mini{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--lagon);border:2px solid var(--ink);display:flex;align-items:flex-end;justify-content:center}
.kid[aria-pressed="true"]{background:var(--ink);color:#fff}
.pcard2{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px;display:grid;gap:10px}
.pcard2 h2{font-family:var(--titre);font-weight:600;font-size:21px;line-height:1.1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px}
.pcard2 h2 small{font-family:var(--ui);font-weight:800;font-size:14px;color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--lagon);border-radius:16px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-family:var(--titre);font-weight:700;font-size:26px;line-height:1}
.kpi small{font-size:13px;color:var(--ink-2);line-height:1.2;display:block;margin-top:4px}
.week-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px}
.wb{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:13px;color:var(--ink-2)}
.wb i{width:100%;max-width:30px;border-radius:8px 8px 3px 3px;background:var(--ballon);border:2px solid var(--ink);min-height:4px}
.wb i.zero{background:var(--lagon);border-style:dashed}
.wb span.v{font-size:12px;font-weight:900;color:var(--ink)}
.tbl{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.tr{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;font-size:14px}
.tr .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid var(--ink);font-family:var(--titre);font-weight:700;font-size:14px}
.tr > span:last-child{display:block;min-width:0}
.tr .bar{display:block;height:10px;border-radius:5px;border:2px solid var(--ink);background:var(--lagon);overflow:hidden;margin-top:3px}
.tr .bar i{display:block;height:100%}
.tr .lb{display:flex;justify-content:space-between;gap:6px;color:var(--ink-2)}
.hard{display:grid;gap:8px}
.hard .row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.hard .eq{font-family:var(--titre);font-weight:700;font-size:20px;background:var(--miel);border:2px solid var(--ink);border-radius:12px;padding:2px 10px}
.hard .row small{color:var(--ink-2);font-size:14px}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dashed var(--lagon-2)}
.prow:last-child{border-bottom:0}
.prow .mini{width:44px;height:44px;border-radius:50%;overflow:hidden;border:3px solid var(--c);display:flex;align-items:flex-end;justify-content:center;background:#fff}
.btn-sm{height:44px;padding:0 9px;border-radius:14px;border:2px solid var(--ink);background:#fff;font-size:13px}
.btn-sm.danger{color:#A3261E;border-color:#A3261E}
.btn-sm.dangerfill{background:#A3261E;color:#fff;border-color:var(--ink)}
.confirm{grid-column:1/-1;background:#FDECEA;border:2px solid #A3261E;border-radius:14px;padding:10px;font-size:15px;display:grid;gap:8px}
.confirm .acts{display:flex;gap:8px;justify-content:flex-end}
.rename{grid-column:2/4;height:44px;border:2px solid var(--ink);border-radius:12px;padding:0 10px;font-family:var(--ui);font-weight:800;font-size:16px;width:100%}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:16px;min-height:52px}
.setrow small{display:block;color:var(--ink-2);font-size:13px;font-weight:700}
.switch{width:62px;height:36px;border-radius:18px;border:3px solid var(--ink);background:var(--lagon);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.switch[aria-checked="true"]{background:var(--feuille)}
.switch[aria-checked="true"]::after{left:27px}
.opts{display:flex;gap:6px}
.opts button{height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-size:14px}
.opts button[aria-pressed="true"]{background:var(--ink);color:#fff}


/* ===== Chrono ===== */
.tbar{flex:1;height:18px;border-radius:9px;border:2px solid var(--ink);background:var(--ile-sombre);overflow:hidden;display:block}
.tbar i{display:block;height:100%;background:#fff;transition:width .25s linear}
.tbar.low i{background:var(--miel)}
.q-count:has(.clock){display:flex;justify-content:space-between;align-items:center}
.clock{display:inline-flex;align-items:center;gap:5px;font-weight:900;font-size:17px}
.clock small{font-size:13px}
/* ===== Île : modes ===== */
.modes2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes2 .discover{padding:8px 10px 8px 8px;gap:8px;min-height:66px}
.modes2 .discover b{font-size:17px}
.modes2 .discover small{font-size:13px;line-height:1.2;display:block}
.modes2 .discover.lock{background:var(--lagon);border-style:dashed;box-shadow:none}
.modes2 .discover .ic.chr{background:#fff}
/* ===== Découvrir ===== */
.dsc-body{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));min-height:0;background:var(--ile-clair)}
.dsc-eq{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:10px 12px;text-align:center}
.dsc-eq b{display:block;font-family:var(--titre);font-weight:700;font-size:48px;line-height:1}
.dsc-eq b .op{color:var(--ile)}
.dsc-eq > span{font-size:17px;color:var(--ink-2)}
.viz{flex:1;min-height:0;background:#fff;border:3px solid var(--ink);border-radius:24px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden}
.vrow{display:flex;align-items:center;gap:8px;animation:pop .25s ease-out both}
.vdots{display:flex;gap:var(--g,4px);flex:1}
.vdots i{width:var(--d,20px);height:var(--d,20px);border-radius:50%;background:var(--ile);border:2px solid var(--ink);flex:none}
.vrow:nth-child(even) .vdots i{background:var(--ile-clair)}
.vtot{min-width:44px;text-align:center;font-family:var(--titre);font-weight:700;font-size:16px;background:var(--lagon);border:2px solid var(--ink);border-radius:10px;padding:0 6px}
.vrow:last-child .vtot{background:var(--miel)}
.mchips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;flex:none}
.mchip{height:58px;border-radius:16px;border:3px solid var(--ink);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-family:var(--titre);font-weight:700;font-size:19px}
.mchip small{font-family:var(--ui);font-weight:800;font-size:13px;color:var(--ink-2)}
.mchip[aria-pressed="true"]{background:var(--ile);color:#fff;box-shadow:0 0 0 3px var(--ile-clair),0 0 0 6px var(--ink)}
.mchip[aria-pressed="true"] small{color:#fff}
/* ===== Bouée ===== */
.wd.buoy i{background:#fff}

/* ===== Écran 7 : Question ===== */
.scr-q{background:var(--ile-clair)}
.q-band{background:var(--ile);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;height:calc(176px + env(safe-area-inset-top,0px));position:relative;flex:none}
.q-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;position:relative;z-index:2}
.q-place{text-align:center;font-family:var(--titre);font-weight:600;font-size:20px;line-height:1.1}
.q-place small{display:block;font-family:var(--ui);font-weight:700;font-size:15px}
.pill-star{height:56px;display:flex;align-items:center;gap:6px;padding:0 12px 0 8px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;font-size:18px;font-weight:900}
.pill-star.coin{background:var(--laiton);color:#fff}
.pill-star .n{display:inline-block;min-width:28px;text-align:right}
.q-progress{display:flex;gap:5px;margin-top:16px;position:relative;z-index:2}
.seg{flex:1;height:14px;border-radius:7px;background:var(--ile-sombre);border:2px solid var(--ink)}
.seg.done{background:#fff}
.seg.now{background:var(--miel)}
.q-count{position:relative;z-index:2;margin-top:6px;font-size:15px;text-align:right}
.decor{position:absolute;left:0;right:0;bottom:24px;height:84px;z-index:1;pointer-events:none}
.decor svg{display:block;width:100%;height:100%}
.q-sheet{flex:1;background:var(--ile-clair);margin-top:-28px;border-radius:32px 32px 0 0;border-top:3px solid var(--ink);position:relative;z-index:3;display:flex;flex-direction:column;padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));gap:12px;min-height:0}
.scr-q .btn-say{background:var(--ile-clair)}
.q-card{background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);min-height:132px;max-height:220px;display:flex;align-items:center;justify-content:center;padding:12px 10px;flex:1 1 auto;overflow:hidden}
.expr{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--titre);font-weight:700;font-size:var(--fs,62px);line-height:1;letter-spacing:-.5px;white-space:nowrap}
.expr .op{color:var(--ile)}
.slot{min-width:var(--sw,96px);height:var(--sh,84px);border:4px dashed var(--ile);border-radius:20px;display:grid;place-items:center;padding:0 10px;color:var(--ink-2);background:var(--ile-clair);transition:background .15s,border-color .15s,color .15s}
.slot.filled{border-style:solid;color:var(--ink);background:#fff}
.slot.ok{background:var(--feuille);border:4px solid var(--ink);color:#fff}
.slot.help{background:var(--miel);border:4px solid var(--ink);color:var(--ink)}
.slot .d{display:inline-block;animation:pop .18s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.expr .shown.ok{color:var(--feuille)}
.q-answer{flex:none;display:flex;flex-direction:column;justify-content:flex-end;margin-top:auto;padding-top:4px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:66px;border-radius:20px;background:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-family:var(--titre);font-weight:700;font-size:34px;transition:transform .06s,box-shadow .06s}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.key.erase{font-family:var(--ui);font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.key.go{background:var(--ile);color:#fff;font-family:var(--ui);font-size:19px}
.key.go[aria-disabled="true"]{background:var(--ile-clair);color:var(--ink-2)}
.key.go[aria-disabled="true"]:active{transform:none;box-shadow:0 5px 0 var(--ink)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.choice{height:112px;border-radius:24px;background:#fff;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-family:var(--titre);font-weight:700;font-size:44px;transition:transform .06s,box-shadow .06s}
.choice:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.choice.ok{background:var(--feuille);color:#fff}
.choice.help{background:var(--miel)}
.choice.off{opacity:.45}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .choice{height:128px;font-family:var(--ui);font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.btn-main{height:64px;border-radius:22px;background:var(--ile);color:#fff;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:22px;width:100%}
.fly{position:absolute;z-index:50;pointer-events:none;width:34px;height:34px}
.pop{animation:pop .3s ease-out}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
<div class="phone" id="app">

  <!-- ÉCRAN 1 : QUI JOUE ? -->
  <section class="screen" data-screen="who" hidden aria-label="Qui joue ?">
    <div class="who-logo"><span id="whoLogo"></span>Multîles</div>
    <div class="who-head">
      <span></span>
      <h1>Qui joue&nbsp;?</h1>
      <button class="btn-say" data-say="Qui joue ? Touche ta carte." aria-label="Écouter"><span class="ico-say"></span><span>Écouter</span></button>
    </div>
    <div class="who-grid" id="whoGrid"></div>
    <div class="who-foot">
      <button class="btn-chip" id="btnParent">
        <svg width="24" height="26" viewBox="0 0 24 26" aria-hidden="true"><rect x="3" y="11" width="18" height="13" rx="4" fill="#1E2440"/><path d="M7 11 V8 a5 5 0 0 1 10 0 V11" fill="none" stroke="#1E2440" stroke-width="3"/></svg>
        Espace parent
      </button>
    </div>
  </section>

  <!-- ÉCRAN 2 : CRÉATION DE PROFIL -->
  <section class="screen" data-screen="create" hidden aria-label="Nouveau joueur">
    <div class="topbar">
      <button class="btn-chip" id="crBack" aria-label="Retour">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 4 L6 11 L14 18" fill="none" stroke="#1E2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Retour
      </button>
      <div class="stepper" id="stepper"></div>
    </div>

    <div class="pane" data-step="1">
      <div class="buddy">
        <div class="m idle" id="crBuddy1"></div>
        <div class="bubble"><p class="t">Salut&nbsp;! Comment tu t'appelles&nbsp;?</p>
          <button class="btn-say" data-say="Salut ! Comment tu t'appelles ? Écris ton prénom." aria-label="Écouter"><span class="ico-say"></span><span>Écouter</span></button></div>
      </div>
      <input class="name-input" id="nameInput" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Ton prénom" aria-label="Ton prénom">
      <p class="name-help">Juste ton prénom, rien d'autre.</p>
      <button class="btn-primary" id="crNext1" aria-disabled="true">Suivant</button>
    </div>

    <div class="pane" data-step="2" hidden>
      <div class="ed" id="edCreate"></div>
      <button class="btn-primary" id="crNext2">Suivant</button>
    </div>

    <div class="pane" data-step="3" hidden>
      <div class="buddy" style="grid-template-columns:1fr 56px">
        <div><h2 class="pane-title">Choisis ton Pépin</h2><p style="font-size:16px;color:var(--ink-2);margin-top:4px">Il va grandir avec toi.</p></div>
        <button class="btn-say" data-say="Choisis ton Pépin. Il va grandir avec toi." aria-label="Écouter"><span class="ico-say"></span><span>Écouter</span></button>
      </div>
      <div class="pep-list" id="pepList"></div>
      <button class="btn-primary" id="crDone" aria-disabled="true" style="margin-top:auto">C'est parti&nbsp;!</button>
    </div>
  </section>

  <!-- ÉCRAN 3 : ÉDITEUR D'AVATAR -->
  <section class="screen" data-screen="editor" hidden aria-label="Mon avatar">
    <div class="topbar tri">
      <button class="btn-chip" id="edBack" aria-label="Retour">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 4 L6 11 L14 18" fill="none" stroke="#1E2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Retour
      </button>
      <div class="ttl">Mon avatar</div>
      <span></span>
    </div>
    <div class="pane">
      <div class="ed" id="edEdit"></div>
      <button class="btn-primary" id="edSave">Enregistrer</button>
    </div>
  </section>

  <!-- ÉCRAN 4 : ACCUEIL -->
  <section class="screen" data-screen="home" hidden aria-label="Accueil">
    <div class="home-band">
      <div class="home-top">
        <button class="chip-switch" id="btnSwitch"><span class="mini" id="miniAv"></span>Changer de joueur</button>
        <button class="btn-say" id="btnSayHome" aria-label="Écouter" style="background:#fff"><span class="ico-say"></span><span>Écouter</span></button>
      </div>
      <p class="home-hello" id="homeHello" aria-live="polite"></p>
      <div class="home-scene">
        <div class="home-ground"></div>
        <button class="home-disc" id="homeAv" aria-label="Modifier mon avatar"></button>
        <div class="home-pep m idle" id="homePep" role="button" tabindex="0" aria-label="Faire réagir ton Pépin"></div>
      </div>
      <div class="home-stats">
        <span class="stat" id="hStars"></span>
        <button class="stat coin" id="hCoins" aria-label="Pièces, ouvrir la boutique"></button>
        <span class="stat lvl" id="hLvl"></span>
      </div>
    </div>
    <div class="home-body">
      <button class="isles-strip" id="hIsles"></button>
      <div class="cards2">
        <button class="hcard" id="hStreak"></button>
        <button class="hcard" id="hDefi"></button>
      </div>
      <button class="btn-play" id="btnPlay"><b>Jouer</b><small id="playSub"></small></button>
    </div>
    <div class="overlay" id="homePop" hidden></div>
    <nav class="tabbar" aria-label="Navigation">
      <button class="tabbtn" aria-current="page" data-tabnav="home"><svg width="30" height="28" viewBox="0 0 30 28" aria-hidden="true"><path class="f" d="M4 13 L15 4 L26 13 V25 H4Z" fill="#fff" stroke="#1E2440" stroke-width="3" stroke-linejoin="round"/><rect x="12" y="16" width="6" height="9" fill="#1E2440"/></svg>Accueil</button>
      <button class="tabbtn" data-tabnav="grid"><svg width="30" height="28" viewBox="0 0 30 28" aria-hidden="true"><rect class="f" x="4" y="3" width="22" height="22" rx="4" fill="#fff" stroke="#1E2440" stroke-width="3"/><path d="M11.3 3 V25 M18.6 3 V25 M4 10.3 H26 M4 17.6 H26" stroke="#1E2440" stroke-width="2.5"/></svg>Ma grille</button>
      <button class="tabbtn" data-tabnav="treasure"><svg width="30" height="28" viewBox="0 0 30 28" aria-hidden="true"><path class="f" d="M4 12 H26 V24 H4Z" fill="#fff" stroke="#1E2440" stroke-width="3" stroke-linejoin="round"/><path d="M4 12 Q4 4 15 4 Q26 4 26 12" fill="#fff" stroke="#1E2440" stroke-width="3"/><rect x="12" y="10" width="6" height="7" rx="2" fill="#1E2440"/></svg>Trésors</button>
    </nav>
  </section>

  <!-- ÉCRAN 5 : CARTE DES ÎLES -->
  <section class="screen" data-screen="map" hidden aria-label="Carte des îles">
    <div class="map-head">
      <button class="btn-chip" id="mapBack" aria-label="Retour"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 4 L6 11 L14 18" fill="none" stroke="#1E2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>Retour</button>
      <div class="ttl">L'archipel</div>
      <span class="cnt" id="mapTrophies"></span>
    </div>
    <div class="sea" id="sea"><div class="sea-in" id="seaIn"></div></div>
    <div class="map-foot"><button class="btn-play slim" id="mapPlay"><b>Continuer</b><small id="mapPlaySub"></small></button></div>
  </section>

  <!-- ÉCRAN 6 : DÉTAIL D'UNE ÎLE -->
  <section class="screen" data-screen="isle" hidden aria-label="Détail de l'île" style="background:var(--ile-clair)">
    <div class="isd-band">
      <div class="isd-top">
        <button class="btn-chip" id="isdBack" aria-label="Retour à la carte"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 4 L6 11 L14 18" fill="none" stroke="#1E2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>Carte</button>
        <span></span>
        <span class="cnt" id="isdStars"></span>
      </div>
      <div class="isd-hero" id="isdHero"></div>
      <div class="isd-prog" id="isdProg"></div>
    </div>
    <div class="isd-body">
      <div class="modes2"><button class="discover" id="isdDiscover"></button><button class="discover" id="isdChrono"></button></div>
      <div class="steps3" id="isdSteps"></div>
      <button class="boss" id="isdBoss"></button>
      <button class="btn-isle" id="isdPlay"></button>
    </div>
  </section>

  <!-- ÉCRAN 9 : FIN DE SESSION -->
  <section class="screen" data-screen="end" hidden aria-label="Fin de session" style="background:var(--ile-clair)">
    <div class="end-band">
      <h1 id="endTitle"></h1>
      <p class="sub" id="endSub"></p>
      <div class="stars3" id="endStars" role="img"></div>
      <div class="end-hero" id="endHero"></div>
    </div>
    <div class="end-body">
      <div class="end-stats" id="endStats"></div>
      <button class="end-grid" id="endGrid"></button>
      <div class="end-actions">
        <button class="btn-isle" id="endNext">Continuer</button>
        <button class="btn-again" id="endAgain"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M17 8 A7 7 0 1 0 18 13" fill="none" stroke="#1E2440" stroke-width="3" stroke-linecap="round"/><path d="M18 3 V8 H13" fill="none" stroke="#1E2440" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Rejouer</button>
      </div>
    </div>
    <div class="overlay" id="endPop" hidden></div>
  </section>

  <!-- ÉCRAN 10 : GRILLE DE PYTHAGORE -->
  <section class="screen" data-screen="grid" hidden aria-label="Ma grille">
    <div class="topbar tri">
      <span></span>
      <div class="ttl" style="font-size:26px">Ma grille</div>
      <button class="btn-say" id="gridSay" aria-label="Écouter" style="justify-self:end;background:#fff"><span class="ico-say"></span><span>Écouter</span></button>
    </div>
    <div class="grid-scroll">
      <div class="g-head"><p class="g-big" id="gCount"></p></div>
      <div class="g-bar" id="gBar" aria-hidden="true"></div>
      <div class="pyth-card"><div class="pyth" id="pyth" role="grid" aria-label="Grille de Pythagore"></div>
        <div class="legend"><span><i style="background:#2E7A2F"></i>Maîtrisée</span><span><i style="background:var(--miel);border-style:dashed"></i>Piège</span><span><i style="background:#fff;border-color:#C9D6DC"></i>À découvrir</span></div></div>
      <div class="g-tip" id="gTip"></div>
      <div class="traps" id="gTraps"></div>

<script>
const INK='#1E2440';
const $=id=>document.getElementById(id);
function mix(h,t,f){const a=[1,3,5].map(i=>parseInt(h.substr(i,2),16)),b=[1,3,5].map(i=>parseInt(t.substr(i,2),16));return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*f).toString(16).padStart(2,'0')).join('');}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= Icônes ================= */
const icoSay=`<svg width="26" height="24" viewBox="0 0 26 24" aria-hidden="true"><path d="M3 9 H8 L14 4 V20 L8 15 H3Z" fill="#1E2440" stroke="#1E2440" stroke-width="2" stroke-linejoin="round"/><path d="M18 8 Q21 12 18 16 M21 5 Q26 12 21 19" fill="none" stroke="#1E2440" stroke-width="2.5" stroke-linecap="round"/></svg>`;
function starIcon(s=30){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?6.2:13;p.push((16+r*Math.cos(a)).toFixed(1)+' '+(17+r*Math.sin(a)).toFixed(1));}return `<svg width="${s}" height="${s}" viewBox="0 0 32 32" aria-hidden="true"><path d="M${p.join(' L')}Z" fill="#FFC93C" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/></svg>`;}
function coinIcon(s=20){return `<svg width="${s}" height="${s}" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#F4B731" stroke="${INK}" stroke-width="3"/><path d="M12 12 L20 20 M20 12 L12 20" stroke="#C98E12" stroke-width="3" stroke-linecap="round"/></svg>`;}
const icoLock=`<svg width="26" height="28" viewBox="0 0 24 26" aria-hidden="true"><rect x="3" y="11" width="18" height="13" rx="4" fill="#1E2440"/><path d="M7 11 V8 a5 5 0 0 1 10 0 V11" fill="none" stroke="#1E2440" stroke-width="3"/></svg>`;
const icoCheck=`<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 11 L9.5 15.5 L17 7" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const icoErase=`<svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><path d="M10 2 H27 Q28 2 28 3 V19 Q28 20 27 20 H10 L2 11Z" fill="none" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M14 7 L22 15 M22 7 L14 15" stroke="${INK}" stroke-width="3" stroke-linecap="round"/></svg>`;
const icoTrue=`<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#157F45" stroke="${INK}" stroke-width="3"/><path d="M12 21 L18 27 L29 14" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const icoFalse=`<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#4D5675" stroke="${INK}" stroke-width="3"/><path d="M14 14 L26 26 M26 14 L14 26" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg>`;
const icoDice=`<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="3" width="20" height="20" rx="6" fill="#fff" stroke="#1E2440" stroke-width="3"/><circle cx="9" cy="9" r="2.2" fill="#1E2440"/><circle cx="17" cy="17" r="2.2" fill="#1E2440"/><circle cx="13" cy="13" r="2.2" fill="#1E2440"/></svg>`;
const logoMark=s=>`<svg width="${s}" height="${s}" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="#2F5BEA" stroke="${INK}" stroke-width="5"/><path d="M14 78 Q37 70 60 78 T106 78 L106 92 Q60 118 14 92Z" fill="#9FD9E8" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><path d="M28 80 C34 58 86 58 92 80Z" fill="#FFC93C" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><path d="M60 64 C62 50 60 40 58 30" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><path d="M60 64 C62 50 60 40 58 30" fill="none" stroke="#9C5A12" stroke-width="4" stroke-linecap="round"/><path d="M58 30 C48 24 36 26 30 34 C40 34 50 34 58 30Z M58 30 C66 22 80 22 88 30 C78 32 66 33 58 30Z" fill="#7CC44E" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/></svg>`;

/* ================= Mascotte Pépin ================= */
const VARIANTS={
  pousse:{name:'Pousse',body:'#7CC44E',belly:'#E3F4CF',sprout:'leaf',leaf:'#3F9A3A',flower:'#FFD24A',desc:'Calme et curieux'},
  corail:{name:'Corail',body:'#FF9A8A',belly:'#FFE6DF',sprout:'coral',leaf:'#E2506A',flower:'#FFFFFF',desc:'Joueur et rieur'},
  braise:{name:'Braise',body:'#FFB547',belly:'#FFF0CF',sprout:'flame',leaf:'#FF7A1F',flower:'#FFD24A',desc:'Rapide et courageux'}
};
const sparkle=(cx,cy,r,fill='#FFC93C')=>`<path d="M${cx} ${cy-r} Q${cx} ${cy} ${cx+r} ${cy} Q${cx} ${cy} ${cx} ${cy+r} Q${cx} ${cy} ${cx-r} ${cy} Q${cx} ${cy} ${cx} ${cy-r}Z" fill="${fill}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`;
function line(x1,y1,x2,y2,col,w){return `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${INK}" stroke-width="${w+5}" stroke-linecap="round"/><path d="M${x1} ${y1} L${x2} ${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;}
function sproutSvg(v,stage){
  const H=[0,14,22,30,36][stage],t=64-H;let s='';
  if(v.sprout==='leaf'){
    s+=line(100,66,100,t,v.leaf,5);
    const leaf=`<path d="M100 ${t+2} C108 ${t-14} 128 ${t-18} 140 ${t-10} C132 ${t+4} 112 ${t+8} 100 ${t+2}Z" fill="${v.leaf}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>`;
    if(stage===1) s+=`<circle cx="100" cy="${t-2}" r="7" fill="${v.leaf}" stroke="${INK}" stroke-width="3.5"/>`;
    if(stage>=2) s+=leaf; if(stage>=3) s+=`<g transform="translate(200,0) scale(-1,1)">${leaf}</g>`;
  }
  if(v.sprout==='coral'){
    const L=(a,b,c,d)=>line(a,b,c,d,v.leaf,6);
    s+=L(100,66,100,t);
    if(stage>=2) s+=L(100,64-H*.5,116,64-H*.5-13);
    if(stage>=3) s+=L(100,64-H*.3,83,64-H*.3-12);
    s+=`<circle cx="100" cy="${t-3}" r="5" fill="${v.leaf}" stroke="${INK}" stroke-width="3"/>`;
  }
  if(v.sprout==='flame'){
    const h=16+stage*8,w=7+stage*2.6;
    const f=(hh,ww,col)=>`<path d="M100 ${66-hh} C${100+ww} ${66-hh*.5} ${100+ww*.95} 62 100 68 C${100-ww*.95} 62 ${100-ww} ${66-hh*.5} 100 ${66-hh}Z" fill="${col}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>`;
    s+=f(h,w,v.leaf); if(stage>=2) s+=f(h*.55,w*.5,v.flower);
  }
  return s;
}
function mascot(o={}){
  const v=VARIANTS[o.variant||'pousse'],stage=o.stage||3,mood=o.mood||'neutre',size=o.size||84;
  let s=`<svg width="${size}" height="${Math.round(size*1.05)}" viewBox="0 0 200 210" role="img" aria-label="Pépin ${v.name}">`;
  s+=`<ellipse cx="100" cy="196" rx="56" ry="6" fill="${INK}" opacity=".12"/>`+sproutSvg(v,stage);
  const arm=(cx,cy,rot)=>`<ellipse cx="${cx}" cy="${cy}" rx="11" ry="17" transform="rotate(${rot} ${cx} ${cy})" fill="${v.body}" stroke="${INK}" stroke-width="3.5"/>`;
  if(mood==='joie') s+=arm(30,112,-58)+arm(170,112,58);
  else if(mood==='encourage') s+=arm(38,142,22)+arm(170,112,58);
  else s+=arm(38,142,22)+arm(162,142,-22);
  s+=`<ellipse cx="76" cy="184" rx="18" ry="9" fill="${v.body}" stroke="${INK}" stroke-width="3.5"/><ellipse cx="124" cy="184" rx="18" ry="9" fill="${v.body}" stroke="${INK}" stroke-width="3.5"/>`;
  s+=`<path d="M100 62 C150 62 168 100 166 132 C164 166 136 182 100 182 C64 182 36 166 34 132 C32 100 50 62 100 62Z" fill="${v.body}" stroke="${INK}" stroke-width="4"/><ellipse cx="100" cy="152" rx="40" ry="24" fill="${v.belly}"/>`;
  s+=`<ellipse cx="62" cy="128" rx="9" ry="5.5" fill="#FF8FA3"/><ellipse cx="138" cy="128" rx="9" ry="5.5" fill="#FF8FA3"/>`;
  const openEye=(x,lk)=>`<circle cx="${x}" cy="108" r="14" fill="#fff" stroke="${INK}" stroke-width="3.5"/><circle cx="${x+lk[0]}" cy="${108+lk[1]}" r="7.5" fill="${INK}"/><circle cx="${x+lk[0]+3}" cy="${104+lk[1]}" r="2.8" fill="#fff"/>`;
  const happyEye=x=>`<path d="M${x-12} 112 Q${x} 98 ${x+12} 112" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
  if(mood==='joie') s+=happyEye(80)+happyEye(120);
  else {const lk=mood==='pense'?[3,-4]:[2,2];s+=openEye(80,lk)+openEye(120,lk);}
  if(mood==='encourage') s+=`<path d="M70 88 Q80 81 90 87" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><path d="M110 87 Q120 81 130 88" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
  if(mood==='joie') s+=`<path d="M84 127 Q100 148 116 127Z" fill="${INK}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M92 139 Q100 133 108 139 Q100 146 92 139Z" fill="#FF7A8A"/>`+(o.noSparkle?'':sparkle(26,60,10)+sparkle(176,70,8));
  else if(mood==='pense') s+=`<circle cx="104" cy="134" r="5" fill="${INK}"/>`;
  else s+=`<path d="M88 130 Q100 141 112 130" fill="none" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`;
  if(o.wear) s+=pepWear(o.wear);
  return s+'</svg>';
}
function pepWear(w){
  let s='';const o=`stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"`;
  if(w.neck==='echarpe') s+=`<path d="M46 144 Q100 166 154 144 L157 158 Q100 182 43 158Z" fill="#E2506A" ${o}/><path d="M122 160 L128 190 L144 186 L136 158Z" fill="#E2506A" ${o}/><path d="M60 150 L62 162 M80 156 L81 168 M100 158 V170 M120 156 L119 168 M140 150 L138 162" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
  if(w.neck==='papillon') s+=`<path d="M100 152 L78 140 L78 166Z M100 152 L122 140 L122 166Z" fill="#2F5BEA" ${o}/><circle cx="100" cy="152" r="7" fill="#2F5BEA" ${o}/>`;
  if(w.face==='soleil') s+=`<rect x="62" y="96" width="34" height="24" rx="9" fill="${INK}"/><rect x="104" y="96" width="34" height="24" rx="9" fill="${INK}"/><path d="M96 104 H104 M62 102 L44 96 M138 102 L156 96" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><path d="M70 102 L78 102" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M112 102 L120 102" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
  if(w.face==='lunettes') s+=`<circle cx="80" cy="108" r="18" fill="none" stroke="${INK}" stroke-width="5"/><circle cx="120" cy="108" r="18" fill="none" stroke="${INK}" stroke-width="5"/><path d="M98 106 H102" stroke="${INK}" stroke-width="5"/>`;
  if(w.head==='fete') s+=`<g transform="rotate(-24 62 74)"><path d="M44 80 L62 30 L80 80Z" fill="#2F5BEA" ${o}/><circle cx="56" cy="62" r="4" fill="#FFC93C"/><circle cx="66" cy="52" r="3.5" fill="#fff"/><circle cx="68" cy="70" r="4" fill="#FF8FA3"/><circle cx="62" cy="28" r="7" fill="#FFC93C" ${o}/></g>`;
  if(w.head==='couronne') s+=`<g transform="rotate(-18 62 70)"><path d="M40 78 L38 50 L52 62 L62 44 L72 62 L86 50 L84 78Z" fill="#F4B731" ${o}/><circle cx="62" cy="68" r="4.5" fill="#E2506A" stroke="${INK}" stroke-width="2.5"/></g>`;
  if(w.head==='bob') s+=`<path d="M58 80 Q60 54 100 54 Q140 54 142 80Z" fill="#FFC93C" ${o}/><path d="M42 82 Q100 70 158 82 Q100 94 42 82Z" fill="#FFC93C" ${o}/><path d="M60 74 Q100 64 140 74" fill="none" stroke="#E2506A" stroke-width="5"/>`;
  return s;
}

/* ================= Avatar ================= */
const PROFILE_COLORS=[['#C8371D','Tomate'],['#0D7A5F','Menthe'],['#8A36A8','Prune'],['#A35400','Ocre']];
const AV={
  face:[['rond','Rond'],['ovale','Ovale'],['doux','Carré doux']],
  hair:[['court','Court'],['boucle','Bouclé'],['milong','Mi-long'],['couettes','Couettes'],['chignon','Chignon'],['ras','Très court']],
  skin:[['#FDDCC4','Clair'],['#F1C29A','Pêche'],['#D9A06E','Doré'],['#B97A4A','Caramel'],['#8C5634','Cacao'],['#5E3A22','Ébène']],
  hairColor:[['#2B1D14','Noir'],['#6B3E1F','Brun'],['#9A6233','Châtain'],['#C4561E','Roux'],['#E6B54A','Blond'],['#7B4FD0','Violet']],
  acc:[['aucun','Aucun'],['lunettes','Lunettes'],['casquette','Casquette'],['bandeau','Bandeau'],['noeud','Nœud'],['etoile','Barrette'],['ecouteurs','Écouteurs',80],['bob','Bob de plage',70],['couronne','Couronne',150]]
};
const TABS=[['face','Visage'],['hair','Coiffure'],['skin','Peau'],['hairColor','Cheveux'],['acc','Accessoire'],['color','Couleur']];
function darken(h,f=.72){return mix(h,'#000000',1-f);}
let CLIPN=0;
function avatar(o){
  const cx=80,cy=80,{face,skin,hair,hairColor:hc,acc}=o,shirt=o.color,size=o.size||160;
  const G={rond:{w:44,top:cy-44},ovale:{w:40,top:cy-48},doux:{w:42,top:cy-46}}[face];
  const w=G.w,top=G.top,sw=3.5;
  let s=`<svg width="${size}" height="${Math.round(size*1.0625)}" viewBox="0 0 160 170" aria-hidden="true">`;
  const capPath=(fringeMid,side,extra=3)=>{const x1=cx-w-extra,x2=cx+w+extra,y0=cy-side;const c=((top-4)-.25*y0)/.75;return `<path d="M${x1} ${y0} C${x1} ${c} ${x2} ${c} ${x2} ${y0} C${x2-6} ${fringeMid+4} ${x1+34} ${fringeMid-8} ${x1} ${y0}Z" fill="${hc}" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"/>`;};
  if(hair==='milong') s+=`<path d="M${cx-w-7} ${cy} C${cx-w-7} ${top-12} ${cx+w+7} ${top-12} ${cx+w+7} ${cy} V${cy+44} Q${cx+w+7} ${cy+52} ${cx+w-1} ${cy+52} H${cx-w+1} Q${cx-w-7} ${cy+52} ${cx-w-7} ${cy+44}Z" fill="${hc}" stroke="${INK}" stroke-width="${sw}"/>`;
  if(hair==='chignon') s+=`<circle cx="${cx}" cy="${top-6}" r="16" fill="${hc}" stroke="${INK}" stroke-width="${sw}"/>`;
  if(hair==='boucle'){for(let a=160;a<=380;a+=22){const r=a*Math.PI/180;s+=`<circle cx="${(cx+(w+5)*Math.cos(r)).toFixed(1)}" cy="${(cy-4+(w+6)*Math.sin(r)).toFixed(1)}" r="15" fill="${hc}" stroke="${INK}" stroke-width="${sw}"/>`;}}
  const torso='M26 170 C26 136 50 124 80 124 C110 124 134 136 134 170Z',ot=o.outfit||'',cid='t'+(++CLIPN);
  if(ot==='cape') s+=`<path d="M30 132 Q20 160 14 170 H146 Q140 160 130 132Z" fill="#E2506A" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  s+=`<defs><clipPath id="${cid}"><path d="${torso}"/></clipPath></defs><path d="${torso}" fill="${ot==='astro'?'#F2F5F8':shirt}"/>`;
  if(ot==='raye') s+=`<g clip-path="url(#${cid})">${[134,146,158].map(y=>`<rect x="20" y="${y}" width="120" height="6" fill="#fff"/>`).join('')}</g>`;
  if(ot==='etoiles') s+=`<g clip-path="url(#${cid})">${sparkle(52,150,7,'#FFC93C')+sparkle(80,160,6,'#FFC93C')+sparkle(108,148,7,'#FFC93C')}</g>`;
  if(ot==='astro') s+=`<g clip-path="url(#${cid})"><rect x="68" y="140" width="24" height="18" rx="4" fill="#2F5BEA" stroke="${INK}" stroke-width="2.5"/><circle cx="74" cy="149" r="2.5" fill="#FFC93C"/><circle cx="86" cy="149" r="2.5" fill="#E2506A"/><rect x="26" y="150" width="14" height="20" fill="${shirt}"/><rect x="120" y="150" width="14" height="20" fill="${shirt}"/></g>`;
  s+=`<path d="${torso}" fill="none" stroke="${INK}" stroke-width="${sw}"/><path d="M66 124 Q80 136 94 124" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
  if(ot==='astro') s+=`<path d="M58 126 Q80 140 102 126" fill="none" stroke="#9AA2B6" stroke-width="7" stroke-linecap="round"/>`;
  if(ot==='cape') s+=`<path d="M28 170 Q30 142 58 128 L62 170Z M132 170 Q130 142 102 128 L98 170Z" fill="#E2506A" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
  if(ot==='cape') s+=`<circle cx="66" cy="130" r="5" fill="#FFC93C" stroke="${INK}" stroke-width="2.5"/><circle cx="94" cy="130" r="5" fill="#FFC93C" stroke="${INK}" stroke-width="2.5"/>`;
  s+=`<rect x="70" y="${cy+26}" width="20" height="20" fill="${skin}" stroke="${INK}" stroke-width="${sw}"/>`;
  s+=`<circle cx="${cx-w}" cy="${cy+8}" r="8" fill="${skin}" stroke="${INK}" stroke-width="${sw}"/><circle cx="${cx+w}" cy="${cy+8}" r="8" fill="${skin}" stroke="${INK}" stroke-width="${sw}"/>`;
  if(face==='rond') s+=`<circle cx="${cx}" cy="${cy}" r="44" fill="${skin}" stroke="${INK}" stroke-width="${sw}"/>`;
  if(face==='ovale') s+=`<ellipse cx="${cx}" cy="${cy}" rx="40" ry="48" fill="${skin}" stroke="${INK}" stroke-width="${sw}"/>`;
  if(face==='doux') s+=`<rect x="${cx-42}" y="${cy-46}" width="84" height="92" rx="30" fill="${skin}" stroke="${INK}" stroke-width="${sw}"/>`;
  s+=`<ellipse cx="${cx-24}" cy="${cy+20}" rx="7" ry="4.5" fill="#F07C8A" opacity=".55"/><ellipse cx="${cx+24}" cy="${cy+20}" rx="7" ry="4.5" fill="#F07C8A" opacity=".55"/>`;
  s+=`<circle cx="${cx-14}" cy="${cy+8}" r="5" fill="${INK}"/><circle cx="${cx+14}" cy="${cy+8}" r="5" fill="${INK}"/><circle cx="${cx-12.5}" cy="${cy+6.2}" r="1.7" fill="#fff"/><circle cx="${cx+15.5}" cy="${cy+6.2}" r="1.7" fill="#fff"/>`;

  if(hair==='boucle'){for(let x=cx-28;x<=cx+28;x+=14){s+=`<circle cx="${x}" cy="${top+10+(Math.abs(x-cx)>20?6:0)}" r="13" fill="${hc}" stroke="${INK}" stroke-width="${sw}"/>`;}}

  if(acc==='lunettes') s+=`<circle cx="${cx-14}" cy="${cy+8}" r="11" fill="#fff" fill-opacity=".25" stroke="${INK}" stroke-width="3.5"/><circle cx="${cx+14}" cy="${cy+8}" r="11" fill="#fff" fill-opacity=".25" stroke="${INK}" stroke-width="3.5"/><path d="M${cx-3} ${cy+8} H${cx+3}" stroke="${INK}" stroke-width="3.5"/>`;
  if(acc==='casquette'){const c=((top-12)-.25*(cy-12))/.75;s+=`<path d="M${cx-w-5} ${cy-12} C${cx-w-5} ${c} ${cx+w+5} ${c} ${cx+w+5} ${cy-12}Z" fill="${shirt}" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M${cx-w-5} ${cy-12} Q${cx+6} ${cy-2} ${cx+w+22} ${cy-14} Q${cx+6} ${cy-22} ${cx-w-5} ${cy-12}Z" fill="${darken(shirt)}" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"/>`;}
  if(acc==='bandeau') s+=`<rect x="${cx-w+2}" y="${cy-20}" width="${2*w-4}" height="10" rx="5" fill="#2F5BEA" stroke="${INK}" stroke-width="3"/>`;
  if(acc==='noeud'){const bx=cx+w-8,by=top+14;s+=`<path d="M${bx} ${by} L${bx-14} ${by-10} L${bx-14} ${by+10}Z M${bx} ${by} L${bx+14} ${by-10} L${bx+14} ${by+10}Z" fill="#E2506A" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><circle cx="${bx}" cy="${by}" r="5" fill="#E2506A" stroke="${INK}" stroke-width="3"/>`;}
  if(acc==='etoile'){const p=[];const bx=cx-w+12,by=top+18;for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?4.5:10;p.push((bx+r*Math.cos(a)).toFixed(1)+' '+(by+r*Math.sin(a)).toFixed(1));}s+=`<path d="M${p.join(' L')}Z" fill="#FFC93C" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`;}
  if(acc==='ecouteurs'){s+=`<path d="M${cx-w-4} ${cy+2} C${cx-w-4} ${top-20} ${cx+w+4} ${top-20} ${cx+w+4} ${cy+2}" fill="none" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><path d="M${cx-w-4} ${cy+2} C${cx-w-4} ${top-20} ${cx+w+4} ${top-20} ${cx+w+4} ${cy+2}" fill="none" stroke="#2F5BEA" stroke-width="4.5" stroke-linecap="round"/>`;[-1,1].forEach(d=>{s+=`<rect x="${cx+d*(w+3)-8}" y="${cy-6}" width="16" height="26" rx="7" fill="#2F5BEA" stroke="${INK}" stroke-width="3.5"/>`;});}
  if(acc==='bob'){const c=((top-10)-.25*(cy-14))/.75;s+=`<path d="M${cx-w+2} ${cy-14} C${cx-w+2} ${c} ${cx+w-2} ${c} ${cx+w-2} ${cy-14}Z" fill="#FFC93C" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M${cx-w-12} ${cy-12} Q${cx} ${cy-24} ${cx+w+12} ${cy-12} Q${cx} ${cy-2} ${cx-w-12} ${cy-12}Z" fill="#FFC93C" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M${cx-w+6} ${cy-22} Q${cx} ${cy-30} ${cx+w-6} ${cy-22}" fill="none" stroke="#E2506A" stroke-width="5"/>`;}
  if(acc==='couronne'){const t=top-2;s+=`<path d="M${cx-24} ${t+8} L${cx-26} ${t-14} L${cx-12} ${t-2} L${cx} ${t-20} L${cx+12} ${t-2} L${cx+26} ${t-14} L${cx+24} ${t+8}Z" fill="#F4B731" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/><circle cx="${cx}" cy="${t+1}" r="4" fill="#E2506A" stroke="${INK}" stroke-width="2.5"/>`;}
  return s+'</svg>';
}
